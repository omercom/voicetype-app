name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify version and build universal package
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          ./scripts/package-release.sh
          (cd dist && shasum -a 256 -c "VoiceType-$version-macOS.zip.sha256")
      - name: Publish release and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "dist/VoiceType-$version-macOS.zip" \
            "dist/VoiceType-$version-macOS.zip.sha256" \
            --verify-tag \
            --title "VoiceType $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Add 1.0.0 resource warning
        if: github.ref_name == 'v1.0.1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --notes-file docs/releases/v1.0.0.md
